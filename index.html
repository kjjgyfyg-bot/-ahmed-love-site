<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى أغلى الناس ❤️</title>
    <style>
        body {
            background: linear-gradient(to bottom, #fce4ec, #f8bbd0);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            overflow-x: hidden;
            color: #4a4a4a;
        }
        header { padding: 50px 20px; }
        h1 { color: #d81b60; font-size: 2.8em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
        .subtitle { font-size: 1.2em; color: #ad1457; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 8px solid white;
            transition: transform 0.4s ease;
        }
        .gallery img:hover { transform: scale(1.03) rotate(1deg); }
        .heart {
            position: fixed;
            top: -10px;
            color: #ff4081;
            font-size: 24px;
            user-select: none;
            z-index: 1000;
            pointer-events: none;
            animation: fall linear forwards;
        }
        @keyframes fall { to { transform: translateY(105vh); } }
        footer { padding: 40px; font-size: 0.9em; color: #880e4f; }
    </style>
</head>
<body>

    <audio id="myAudio" src="سرك ايه.mp3" loop></audio>

    <header>
        <h1>كل لحظة معاك هي عيد ❤️</h1>
        <p class="subtitle">اضغط في أي مكان في الصفحة عشان المفاجأة تبدأ..</p>
    </header>

    <div class="gallery">
        <img src="Snapchat-803055888.jpg">
        <img src="Snapchat-1222503176.jpg">
        <img src="Snapchat-1649663185.jpg">
        <img src="Snapchat-637010882.jpg">
        <img src="Snapchat-1275894081.jpg">
        <img src="Snapchat-126097399.jpg">
        <img src="Snapchat-1941497273.jpg">
        <img src="Snapchat-1541570646.jpg">
        <img src="Snapchat-1973324292.jpg">
        <img src="Snapchat-1951374337.jpg">
        <img src="IMG-20260427-WA0008.jpg">
        <img src="IMG-20260427-WA0007.jpg">
        <img src="IMG-20260427-WA0006.jpg">
        <img src="IMG-20260427-WA0005.jpg">
        <img src="IMG-20260427-WA0003.jpg">
        </div>

    <footer>صُنع بكل حب ❤️</footer>

    <script>
        document.body.addEventListener('click', function() {
            var audio = document.getElementById('myAudio');
            audio.play();
            setInterval(createHeart, 400);
        }, { once: true });

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            heart.style.opacity = Math.random() * 0.5 + 0.5;
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
    </script>
</body>
</html>
